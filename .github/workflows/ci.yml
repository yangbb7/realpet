name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift:
    name: Swift Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cd RealPet && swift build -c release
      - name: Test build
        run: cd RealPet && swift build
      - name: Test application edit menu
        run: |
          cd RealPet
          swiftc Services/ApplicationMenu.swift Tests/ApplicationMenuCheck.swift \
            -o /tmp/realpet-application-menu-check
          /tmp/realpet-application-menu-check
      - name: Test persisted-state recovery
        run: |
          cd RealPet
          swiftc Models/PetPersonality.swift \
            Models/PetCloudReference.swift \
            Models/Pet.swift \
            Tests/PetRecoveryCheck.swift \
            -o /tmp/realpet-pet-recovery-check
          /tmp/realpet-pet-recovery-check
      - name: Test interaction architecture
        run: |
          cd RealPet
          swiftc Models/PetPersonality.swift Models/PetCloudReference.swift \
            Models/PetActionManifest.swift \
            Models/InteractionModels.swift \
            Models/PetBehaviorMemory.swift \
            Models/PetBehaviorPolicy.swift \
            Services/InteractionHub.swift \
            Services/InteractionAdapter.swift Services/PetRuntimeController.swift \
            Services/PetBehaviorDirector.swift \
            Services/PetActionLibrary.swift \
            Tests/InteractionArchitectureCheck.swift \
            -o /tmp/realpet-interaction-check
          /tmp/realpet-interaction-check
      - name: Test source-frame runtime contracts
        run: |
          cd RealPet
          swiftc Models/PetActionManifest.swift Models/PetFeatureManifest.swift \
            Models/InteractionModels.swift \
            Services/InteractionHub.swift Services/InteractionAdapter.swift \
            Services/PetRuntimeController.swift Services/FrameSequencePetRuntime.swift \
            Tests/FrameSequenceRuntimeCheck.swift \
            -o /tmp/realpet-frame-runtime-check
          /tmp/realpet-frame-runtime-check
      - name: Test motion generation contracts
        run: |
          cd RealPet
          swiftc Models/PetActionManifest.swift \
            Models/PetCloudReference.swift \
            Models/PetAssetProfile.swift \
            Models/MotionGenerationModels.swift \
            Services/PetReferenceImageData.swift \
            Services/SupabasePetReferenceStorage.swift \
            Services/SupabaseGoogleSession.swift \
            Services/SupabaseMiniMaxVideoGatewayClient.swift \
            Services/PetActionLibrary.swift \
            Services/TrackMatteCommand.swift \
            Tests/MotionGenerationContractCheck.swift \
            -o /tmp/realpet-motion-generation-check
          /tmp/realpet-motion-generation-check
      - name: Package app structural smoke
        run: |
          printf '#!/bin/sh\nprintf "ffmpeg version realpet-ci\\n"\n' > /tmp/realpet-ci-ffmpeg
          chmod +x /tmp/realpet-ci-ffmpeg
          cp /tmp/realpet-ci-ffmpeg /tmp/realpet-ci-ffprobe
          REALPET_SUPABASE_PUBLISHABLE_KEY=publishable-ci-key \
          REALPET_FFMPEG_PATH=/tmp/realpet-ci-ffmpeg \
          REALPET_FFMPEG_SHA256="$(shasum -a 256 /tmp/realpet-ci-ffmpeg | awk '{print $1}')" \
          REALPET_FFPROBE_PATH=/tmp/realpet-ci-ffprobe \
          REALPET_FFPROBE_SHA256="$(shasum -a 256 /tmp/realpet-ci-ffprobe | awk '{print $1}')" \
          REALPET_DIST_DIR="${RUNNER_TEMP}/realpet-ci-package" \
          ./build_app.sh --stub-weights --reuse-swift-build
          test -x "${RUNNER_TEMP}/realpet-ci-package/RealPet.app/Contents/MacOS/RealPet"
          test -f "${RUNNER_TEMP}/realpet-ci-package/RealPet.app/Contents/Resources/requirements.lock"
          plutil -extract RealPetSupabasePublishableKey raw \
            "${RUNNER_TEMP}/realpet-ci-package/RealPet.app/Contents/Info.plist" | grep -qx publishable-ci-key
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw \
            "${RUNNER_TEMP}/realpet-ci-package/RealPet.app/Contents/Info.plist" | grep -qx realpet-auth

  python:
    name: Python Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check scripts/ pipeline/ tests/ --select E,F,W --ignore E501
      - name: Run tests (unit only)
        run: >-
          pytest tests/test_quality_check.py tests/test_pet_detector.py
          tests/test_memory_optimization.py
          tests/test_model_packaging.py tests/test_action_quality.py
          tests/test_frame_preservation.py
          -v --timeout=60
        env:
          REALPET_WEIGHTS_DIR: /tmp/weights
