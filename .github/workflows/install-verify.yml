name: install-verify

# Weekly release-preparation gate. It intentionally downloads only immutable
# model revisions, checks their SHA-256 digests, then packages those verified
# assets. Fast unit coverage lives in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  install-verify:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Cache locked Python artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.lock', 'requirements-dev.lock') }}

      - name: Cache verified model artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/realpet-release-weights
          key: weights-${{ runner.os }}-${{ hashFiles('scripts/bundle_weights.py', 'scripts/download_weights.py', 'scripts/verify_release_assets.py') }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install locked runtime and prepare verified weights
        env:
          REALPET_VENV: ${{ runner.temp }}/realpet-venv
          REALPET_WEIGHTS_DIR: ${{ runner.temp }}/realpet-release-weights
        run: |
          bash install.sh
          "$REALPET_VENV/bin/python" scripts/verify_release_assets.py --weights-dir "$REALPET_WEIGHTS_DIR"

      - name: Inference smoke with only verified local weights
        env:
          REALPET_VENV: ${{ runner.temp }}/realpet-venv
          REALPET_WEIGHTS_DIR: ${{ runner.temp }}/realpet-release-weights
          TORCH_HOME: ${{ runner.temp }}/realpet-release-weights/torch
        run: |
          "$REALPET_VENV/bin/python" scripts/ci_inference_smoke.py

      - name: Swift build (release)
        run: cd RealPet && swift build -c release

      - name: Package verified release assets
        env:
          REALPET_VENV: ${{ runner.temp }}/realpet-venv
          REALPET_WEIGHTS_DIR: ${{ runner.temp }}/realpet-release-weights
          REALPET_DIST_DIR: ${{ runner.temp }}/realpet-package
          REALPET_SUPABASE_PUBLISHABLE_KEY: publishable-ci-key
          REALPET_FFMPEG_PATH: /usr/local/bin/ffmpeg
        run: |
          if [ ! -x "$REALPET_FFMPEG_PATH" ]; then
            REALPET_FFMPEG_PATH="$(command -v ffmpeg)"
          fi
          test -x "$REALPET_FFMPEG_PATH"
          export REALPET_FFMPEG_PATH
          export REALPET_FFMPEG_SHA256="$(shasum -a 256 "$REALPET_FFMPEG_PATH" | awk '{print $1}')"
          export REALPET_FFPROBE_PATH="$(command -v ffprobe)"
          test -x "$REALPET_FFPROBE_PATH"
          export REALPET_FFPROBE_SHA256="$(shasum -a 256 "$REALPET_FFPROBE_PATH" | awk '{print $1}')"
          export REALPET_BUILD_PYTHON="$REALPET_VENV/bin/python"
          ./build_app.sh
          APP="$REALPET_DIST_DIR/RealPet.app"
          test -x "$APP/Contents/MacOS/RealPet"
          test -f "$APP/Contents/Resources/requirements.lock"
          test ! -e "$APP/Contents/Resources/weights/sam2/.stub-weights-ci-only"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"

      - name: track_then_matte help does not require a model load
        env:
          REALPET_VENV: ${{ runner.temp }}/realpet-venv
          REALPET_WEIGHTS_DIR: ${{ runner.temp }}/realpet-release-weights
        run: |
          "$REALPET_VENV/bin/python" scripts/track_then_matte.py --help | head -5
